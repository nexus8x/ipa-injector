name: Auto Inject IPA and Tweak Pro

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct tới file IPA gốc (Decrypted)'
        required: true
        type: string

      deb_urls:
        description: 'Một hoặc nhiều URL tweak (.deb), mỗi link một dòng'
        required: true
        type: string

      display_name:
        description: 'Tên App mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string

      bundle_id:
        description: 'Bundle ID mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download IPA
        run: |
          set -e

          echo "📥 Đang tải IPA..."
          wget --tries=3 --timeout=30 "${{ inputs.ipa_url }}" -O youtube.ipa

          if [ ! -s youtube.ipa ]; then
            echo "❌ Không tải được IPA!"
            exit 1
          fi

          echo "✅ IPA tải thành công:"
          ls -lh youtube.ipa

      - name: Download Tweaks
        run: |
          set -e

          echo "📥 Đang tải tweak..."

          count=1

          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "$url" ] && continue

            echo "→ $url"

            wget --tries=3 --timeout=30 "$url" -O "tweak$count.deb"

            if [ ! -s "tweak$count.deb" ]; then
              echo "❌ Không tải được tweak số $count"
              exit 1
            fi

            count=$((count+1))

          done << 'EOF'
${{ inputs.deb_urls }}
EOF

          echo ""
          echo "✅ Danh sách tweak:"
          ls -lh *.deb

      - name: Install Cyan
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Show Environment
        run: |
          echo "===== Cyan Version ====="
          cyan --version || true

          echo ""
          echo "===== Files ====="
          ls -lah

      - name: Inject Tweaks
        run: |
          set -e

          tweaks=""

          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done

          echo "Tweaks:$tweaks"

          OUTPUT="Output_App.ipa"

          if [ -n "${{ inputs.display_name }}" ]; then
            SAFE_NAME=$(echo "${{ inputs.display_name }}" | tr '/\:*?"<>|' '_')
            OUTPUT="${SAFE_NAME}.ipa"
          fi

          CMD="cyan -i youtube.ipa -o \"$OUTPUT\" -uwef $tweaks"

          if [ -n "${{ inputs.display_name }}" ]; then
            CMD="$CMD -n \"${{ inputs.display_name }}\""
          fi

          if [ -n "${{ inputs.bundle_id }}" ]; then
            CMD="$CMD -b \"${{ inputs.bundle_id }}\""
          fi

          echo ""
          echo "===== Running ====="
          echo "$CMD"

          eval "$CMD"

          echo ""
          echo "✅ Hoàn thành!"
          ls -lh "$OUTPUT"

      - name: Upload Patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: Patched-IPA
          path: "*.ipa"
