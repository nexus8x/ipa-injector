name: Auto Inject IPA and Tweak Pro

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct tới file IPA gốc (Decrypted)'
        required: true
        type: string

      deb_urls:
        description: 'Một hoặc nhiều URL tweak (.deb), mỗi link một dòng'
        required: true
        type: string

      display_name:
        description: 'Tên App mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string

      bundle_id:
        description: 'Bundle ID mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download IPA and Tweaks
        shell: bash
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          DEB_URLS: ${{ inputs.deb_urls }}
        run: |
          echo "Đang tải IPA..."
          wget "$IPA_URL" --no-verbose -O youtube.ipa

          echo "Đang tải các tweak..."
          i=1
          while IFS= read -r url; do
            if [ -n "$url" ]; then
              echo "Tải tweak $i: $url"
              wget "$url" --no-verbose -O "tweak_$i.deb"
              i=$((i+1))
            fi
          done <<< "$DEB_URLS"

          echo "Danh sách tweak:"
          ls -lh *.deb

      - name: Install cyan tool
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject Tweaks into IPA
        shell: bash
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          args=(-i youtube.ipa -o Output_App.ipa -uwef)

          for f in *.deb; do
            [ -f "$f" ] && args+=("$f")
          done

          if [ -n "$DISPLAY_NAME" ]; then
            args+=(-n "$DISPLAY_NAME")
          fi

          if [ -n "$BUNDLE_ID" ]; then
            args+=(-b "$BUNDLE_ID")
          fi

          echo "===================================="
          echo "Tweaks sẽ inject:"
          printf ' - %s\n' *.deb
          echo "===================================="

          cyan "${args[@]}"

      - name: Upload Patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-Da-Inject
          path: Output_App.ipa
