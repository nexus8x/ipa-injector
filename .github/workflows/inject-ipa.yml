name: Auto Inject IPA and Multiple Tweaks

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct IPA'
        required: true
        type: string
      deb_urls:
        description: 'URL direct Debs'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Files
        run: |
          curl -L "${{ inputs.ipa_url }}" -o input.ipa
          COUNTER=1
          CMD_ARGS="-i input.ipa -o Output_App.ipa"
          for url in ${{ inputs.deb_urls }}; do
            [ -z "$url" ] && continue
            curl -L "$url" -o "tweak_$COUNTER.deb"
            CMD_ARGS="$CMD_ARGS -f tweak_$COUNTER.deb"
            COUNTER=$((COUNTER + 1))
          done
          echo "CYAN_CMD=cyan $CMD_ARGS" >> $GITHUB_ENV

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject and Process
        run: |
          eval $CYAN_CMD
          mv Output_App.ipa Injected_App.ipa
          echo "FINAL_FILE=Injected_App.ipa" >> $GITHUB_ENV
          echo "APP_NAME=CustomApp" >> $GITHUB_ENV
          echo "APP_VER=1.0.0" >> $GITHUB_ENV

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" || true
          git push origin "$TAG" || true
          gh release create "$TAG" "Injected_App.ipa" --title "Custom App v1.0.0" --notes "Injected via GitHub Actions"
