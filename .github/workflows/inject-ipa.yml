name: Auto Inject IPA and Multiple Tweaks

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct IPA'
        required: true
        type: string
      deb_urls:
        description: 'URL direct Debs (cach nhau khoang trang)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Files
        run: |
          curl -L "${{ inputs.ipa_url }}" -o input.ipa
          
          COUNTER=1
          CMD_ARGS="-i input.ipa -o Output_App.ipa"
          for url in ${{ inputs.deb_urls }}; do
            [ -z "$url" ] && continue
            curl -L "$url" -o "tweak_$COUNTER.deb"
            CMD_ARGS="$CMD_ARGS -f tweak_$COUNTER.deb"
            COUNTER=$((COUNTER + 1))
          done
          echo "CYAN_CMD=cyan $CMD_ARGS" >> $GITHUB_ENV

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject and Process
        run: |
          eval $CYAN_CMD
          
          python3 -c "
import plistlib, os, glob
plist_path = glob.glob('extracted_app/Payload/*/Info.plist', recursive=True) or glob.glob('Payload/*/Info.plist')
if not plist_path:
    import zipfile
    with zipfile.ZipFile('Output_App.ipa', 'r') as z:
        for f in z.namelist():
            if f.endswith('Info.plist'):
                z.extract(f, 'temp_plist')
                break
    plist_path = glob.glob('temp_plist/**/Info.plist', recursive=True)

if plist_path:
    with open(plist_path[0], 'rb') as f:
        pl = plistlib.load(f)
    name = pl.get('CFBundleDisplayName') or pl.get('CFBundleName') or 'App'
    ver = pl.get('CFBundleShortVersionString') or '1.0'
else:
    name, ver = 'App', '1.0'

safe_name = ''.join(c for c in name if c.isalnum() or c in (' ', '_', '-')).strip().replace(' ', '_')
with open(os.environ['GITHUB_ENV'], 'a') as env:
    env.write(f'APP_NAME={name}\n')
    env.write(f'APP_VER={ver}\n')
    env.write(f'SAFE_NAME={safe_name}\n')
"
          mv Output_App.ipa "${{ env.SAFE_NAME }}_v${{ env.APP_VER }}.ipa"
          echo "FINAL_FILE=${{ env.SAFE_NAME }}_v${{ env.APP_VER }}.ipa" >> $GITHUB_ENV

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.APP_VER }}-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          
          gh release create "$TAG" "${{ env.FINAL_FILE }}" --title "${{ env.APP_NAME }} ${{ env.APP_VER }}" --notes "App Name: ${{ env.APP_NAME }} | Version: ${{ env.APP_VER }}"
