name: Custom IPA Direct Injector

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct tới file IPA gốc (Decrypted)'
        required: true
        type: string
      deb_urls:
        description: 'Danh sách URL các file Tweak (.deb), mỗi link một dòng'
        required: true
        type: string
      display_name:
        description: 'Tên App mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string
      bundle_id:
        description: 'Bundle ID mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download IPA and Tweaks via Direct Links
        env:
          DEB_URLS_INPUT: ${{ inputs.deb_urls }}
          IPA_URL_INPUT: ${{ inputs.ipa_url }}
        run: |
          echo "Đang tải file IPA gốc..."
          curl -L "$IPA_URL_INPUT" -o youtube.ipa
          
          echo "Đang tạo script tải tweak qua biến môi trường an toàn..."
          cat << 'EOF' > download_tweaks.py
import urllib.request
import os
import sys

raw_urls = os.environ.get("DEB_URLS_INPUT", "")
urls = raw_urls.strip().splitlines()

index = 1
for url in urls:
    url = url.strip()
    if not url:
        continue
    filename = f"tweak_{index}.deb"
    print(f"Đang tải tweak {index} từ: {url}")
    try:
        headers = {"User-Agent": "Mozilla/5.0"}
        req = urllib.request.Request(url, headers=headers)
        with urllib.request.urlopen(req) as response, open(filename, "wb") as out_file:
            out_file.write(response.read())
        print(f"Đã lưu thành công: {filename}")
        index += 1
    except Exception as e:
        print(f"Lỗi khi tải {url}: {e}")
EOF

          echo "Đang thực thi script tải tweak..."
          python3 download_tweaks.py
          
          echo "Kiểm tra toàn bộ file sau khi tải:"
          ls -la

      - name: Install Cyan Tool (Pyzule-rw Engine)
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject Tweaks & Optimize for SideStore / LiveContainer
        run: |
          tweaks=""
          for f in tweak_*.deb; do
            if [ -f "$f" ]; then
              tweaks="$tweaks -f $f"
            fi
          done
          
          echo "Danh sách tham số tweak truyền vào: $tweaks"
          
          CMD="cyan -i youtube.ipa -o Output_Final.ipa -uwe $tweaks"
          
          if [ -n "${{ inputs.display_name }}" ]; then
            CMD="$CMD -n '${{ inputs.display_name }}'"
          fi
          
          if [ -n "${{ inputs.bundle_id }}" ]; then
            CMD="$CMD -b ${{ inputs.bundle_id }}"
          fi
          
          echo "Thực thi lệnh: $CMD"
          eval $CMD

      - name: Upload Final Patched IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patched-IPA-Ready-For-SideStore
          path: Output_Final.ipa
