name: Auto Inject IPA and Multiple Tweaks

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct IPA'
        required: true
        type: string
      deb_urls:
        description: 'URL direct Debs'
        required: true
        type: string
      display_name:
        description: 'Tên App mới (ĐỂ TRỐNG NẾU GIỮ NGUYÊN)'
        required: false
        default: ''
        type: string
      bundle_id:
        description: 'Bundle ID mới (ĐỂ TRỐNG NẾU GIỮ NGUYÊN)'
        required: false
        default: ''
        type: string

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Files
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          DEB_URLS: ${{ inputs.deb_urls }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          curl -L "$IPA_URL" -o input.ipa
          
          COUNTER=1
          CMD_ARGS="-i input.ipa -o Output_App.ipa"
          
          for url in $DEB_URLS; do
            [ -z "$url" ] && continue
            curl -L "$url" -o "tweak_$COUNTER.deb"
            CMD_ARGS="$CMD_ARGS -f tweak_$COUNTER.deb"
            COUNTER=$((COUNTER + 1))
          done
          
          if [ -n "$DISPLAY_NAME" ]; then
            CMD_ARGS="$CMD_ARGS -n '$DISPLAY_NAME'"
          fi
          
          if [ -n "$BUNDLE_ID" ]; then
            CMD_ARGS="$CMD_ARGS -b $BUNDLE_ID"
          fi
          
          echo "CYAN_CMD=cyan $CMD_ARGS" >> $GITHUB_ENV

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject and Process
        env:
          CUSTOM_DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          eval $CYAN_CMD
          
          python3 -c "
import plistlib, os, zipfile, glob

with zipfile.ZipFile('Output_App.ipa', 'r') as z:
    for filename in z.namelist():
        if 'Payload/' in filename and filename.endswith('Info.plist'):
            z.extract(filename, 'extracted_info')
            break

plist_files = glob.glob('extracted_info/Payload/**/Info.plist', recursive=True)
if plist_files:
    with open(plist_files[0], 'rb') as f:
        pl = plistlib.load(f)
    name = pl.get('CFBundleDisplayName') or pl.get('CFBundleName') or 'App'
    ver = pl.get('CFBundleShortVersionString') or '1.0'
else:
    name, ver = 'App', '1.0'

custom_name = os.environ.get('CUSTOM_DISPLAY_NAME', '').strip()
if custom_name:
    name = custom_name

safe_name = ''.join(c for c in name if c.isalnum() or c in (' ', '_', '-')).strip().replace(' ', '_')
with open(os.environ['GITHUB_ENV'], 'a') as env:
    env.write(f'APP_NAME={name}\n')
    env.write(f'APP_VER={ver}\n')
    env.write(f'SAFE_NAME={safe_name}\n')
"
          mv Output_App.ipa "${{ env.SAFE_NAME }}_v${{ env.APP_VER }}.ipa"
          echo "FINAL_FILE=${{ env.SAFE_NAME }}_v${{ env.APP_VER }}.ipa" >> $GITHUB_ENV

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.APP_VER }}-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" || true
          git push origin "$TAG" || true
          
          gh release create "$TAG" "${{ env.FINAL_FILE }}" --title "${{ env.APP_NAME }} v${{ env.APP_VER }}" --notes "App Name: ${{ env.APP_NAME }} | Version: ${{ env.APP_VER }} | Injected via GitHub Actions"
