name: Auto Inject IPA and Multiple Tweaks

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct IPA'
        required: true
        type: string
      deb_urls:
        description: 'URL direct Debs'
        required: true
        type: string
      display_name:
        description: 'Tên App mới (ĐỂ TRỐNG NẾU GIỮ NGUYÊN)'
        required: false
        default: ''
        type: string
      bundle_id:
        description: 'Bundle ID mới (ĐỂ TRỐNG NẾU GIỮ NGUYÊN)'
        required: false
        default: ''
        type: string

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Files
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          DEB_URLS: ${{ inputs.deb_urls }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          curl -L "$IPA_URL" -o input.ipa
          
          COUNTER=1
          CMD_ARGS="-i input.ipa -o Output_App.ipa"
          
          for url in $DEB_URLS; do
            [ -z "$url" ] && continue
            curl -L "$url" -o "tweak_$COUNTER.deb"
            CMD_ARGS="$CMD_ARGS -f tweak_$COUNTER.deb"
            COUNTER=$((COUNTER + 1))
          done
          
          if [ -n "$DISPLAY_NAME" ]; then
            CMD_ARGS="$CMD_ARGS -n '$DISPLAY_NAME'"
          fi
          
          if [ -n "$BUNDLE_ID" ]; then
            CMD_ARGS="$CMD_ARGS -b $BUNDLE_ID"
          fi
          
          echo "CYAN_CMD=cyan $CMD_ARGS" >> $GITHUB_ENV

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject and Process
        env:
          CUSTOM_DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          eval $CYAN_CMD
          
          # Tự động giải nén và đọc tên/version thật từ Info.plist bằng công cụ sẵn có trên macOS
          mkdir -p temp_extracted
          unzip -q Output_App.ipa -d temp_extracted
          
          PLIST_PATH=$(find temp_extracted/Payload -name "Info.plist" -maxdepth 3 | head -n 1)
          
          if [ -f "$PLIST_PATH" ]; then
            # Dùng plutil (công cụ native của macOS) để đọc file plist ra định dạng XML/Text dễ lọc
            plutil -convert xml1 "$PLIST_PATH" -o parsed_plist.xml
            
            # Trích xuất CFBundleDisplayName hoặc CFBundleName
            EXTRACTED_NAME=$(python3 -c "
import xml.etree.ElementTree as ET
try:
    tree = ET.parse('parsed_plist.xml')
    root = tree.getroot()
    d = root[0]
    keys = d.findall('key')
    name = 'App'
    ver = '1.0'
    for i, k in enumerate(keys):
        if k.text == 'CFBundleDisplayName' or k.text == 'CFBundleName':
            name = d[i+1].text
        if k.text == 'CFBundleShortVersionString':
            ver = d[i+1].text
    print(name)
    print(ver)
except:
    print('App')
    print('1.0')
" | sed -n '1p')
            
            EXTRACTED_VER=$(python3 -c "
import xml.etree.ElementTree as ET
try:
    tree = ET.parse('parsed_plist.xml')
    root = tree.getroot()
    d = root[0]
    keys = d.findall('key')
    ver = '1.0'
    for i, k in enumerate(keys):
        if k.text == 'CFBundleShortVersionString':
            ver = d[i+1].text
    print(ver)
except:
    print('1.0')
" | sed -n '1p')
          else
            EXTRACTED_NAME="App"
            EXTRACTED_VER="1.0"
          fi
          
          # Ưu tiên lấy tên bạn tự nhập ở ô display_name, nếu để trống thì lấy tên thật của app
          if [ -n "$CUSTOM_DISPLAY_NAME" ]; then
            APP_NAME="$CUSTOM_DISPLAY_NAME"
          else
            APP_NAME="$EXTRACTED_NAME"
          fi
          
          APP_VER="$EXTRACTED_VER"
          
          SAFE_NAME=$(echo "$APP_NAME" | tr -cd '[:alnum:]_-_ ')
          SAFE_NAME=$(echo "$SAFE_NAME" | tr ' ' '_')
          
          FINAL_IPA="${SAFE_NAME}_v${APP_VER}.ipa"
          mv Output_App.ipa "$FINAL_IPA"
          
          echo "FINAL_FILE=$FINAL_IPA" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_VER=$APP_VER" >> $GITHUB_ENV

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.APP_VER }}-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" || true
          git push origin "$TAG" || true
          
          gh release create "$TAG" "${{ env.FINAL_FILE }}" --title "${{ env.APP_NAME }} v${{ env.APP_VER }}" --notes "App Name: ${{ env.APP_NAME }} | Version: ${{ env.APP_VER }} | Injected via GitHub Actions"
