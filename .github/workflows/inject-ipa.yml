name: Auto Inject IPA and Tweak Pro AutoFix

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct IPA'
        required: true
        type: string

      deb_url_1:
        description: 'Tweak 1 (.deb)'
        required: false
        default: ''
        type: string

      deb_url_2:
        description: 'Tweak 2 (.deb)'
        required: false
        default: ''
        type: string

      deb_url_3:
        description: 'Tweak 3 (.deb)'
        required: false
        default: ''
        type: string

      deb_url_4:
        description: 'Tweak 4 (.deb)'
        required: false
        default: ''
        type: string

      deb_url_5:
        description: 'Tweak 5 (.deb)'
        required: false
        default: ''
        type: string

      display_name:
        description: 'Tên App'
        required: false
        default: ''
        type: string

      bundle_id:
        description: 'Bundle ID'
        required: false
        default: ''
        type: string


jobs:

  build:

    runs-on: macos-latest


    steps:

    - uses: actions/checkout@v4



    - name: Download IPA and DEB
      shell: bash
      env:

        IPA_URL: ${{ inputs.ipa_url }}

        DEB1: ${{ inputs.deb_url_1 }}
        DEB2: ${{ inputs.deb_url_2 }}
        DEB3: ${{ inputs.deb_url_3 }}
        DEB4: ${{ inputs.deb_url_4 }}
        DEB5: ${{ inputs.deb_url_5 }}

      run: |

        set -e


        wget "$IPA_URL" -O app.ipa


        i=1

        for url in "$DEB1" "$DEB2" "$DEB3" "$DEB4" "$DEB5"
        do

          if [ -n "$url" ]; then

            wget "$url" -O "tweak_$i.deb"

            i=$((i+1))

          fi

        done



    - name: Install tools

      run: |

        pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

        brew install dpkg



    - name: Extract all dylib from tweaks

      run: |

        mkdir -p extracted


        for deb in tweak_*.deb
        do

          [ -f "$deb" ] || continue


          mkdir temp


          dpkg-deb -x "$deb" temp


          find temp -name "*.dylib" -exec cp {} extracted/ \;


          rm -rf temp


        done


        echo "Dylib found:"
        ls -la extracted || true



    - name: Inject tweaks

      env:

        NAME: ${{ inputs.display_name }}

        BID: ${{ inputs.bundle_id }}

      run: |

        args=(-i app.ipa -o injected.ipa -uwef)


        for deb in tweak_*.deb

        do

          [ -f "$deb" ] && args+=("$deb")

        done



        if [ -n "$NAME" ]; then

          args+=(-n "$NAME")

        fi


        if [ -n "$BID" ]; then

          args+=(-b "$BID")

        fi



        cyan "${args[@]}"



    - name: Add dependency dylib

      run: |

        set -e


        mkdir work


        unzip -q injected.ipa -d work


        APP=$(find work -name "*.app" | head -1)



        mkdir -p "$APP/Frameworks"



        cp extracted/*.dylib "$APP/Frameworks/" 2>/dev/null || true



        for dylib in "$APP/Frameworks/"*.dylib

        do

          if [ -f "$dylib" ]; then

            install_name_tool \
            -add_rpath "@loader_path/Frameworks" \
            "$dylib" || true

          fi

        done



        cd work

        zip -qr ../fixed.ipa .



    - name: Upload IPA

      uses: actions/upload-artifact@v4

      with:

        name: IPA-Fixed

        path: fixed.ipa
