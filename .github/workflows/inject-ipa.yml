name: Auto Inject IPA and Tweak Pro

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct tới file IPA gốc (Decrypted)'
        required: true
        type: string
      deb_urls:
        description: 'Danh sách URL các file Tweak (.deb), mỗi link một dòng'
        required: true
        type: string
      display_name:
        description: 'Tên App mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string
      bundle_id:
        description: 'Bundle ID mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download IPA and Tweaks
        run: |
          echo "Đang tải file IPA..."
          curl -L "${{ inputs.ipa_url }}" -o youtube.ipa
          
          echo "Đang tải các file Tweak (.deb)..."
          # Dùng python để tách dòng và tải chuẩn xác 100% trên macOS
          python3 -c '
import urllib.request
import os

urls = """${{ inputs.deb_urls }}""".strip().splitlines()
for i, url in enumerate(urls, 1):
    url = url.strip()
    if not url:
        continue
    filename = f"tweak_{i}.deb"
    print(f"Đang tải tweak {i} từ: {url}")
    try:
        headers = {"User-Agent": "Mozilla/5.0"}
        req = urllib.request.Request(url, headers=headers)
        with urllib.request.urlopen(req) as response, open(filename, "wb") as out_file:
            out_file.write(response.read())
        print(f"Đã lưu thành công: {filename}")
    except Exception as e:
        print(f"Lỗi khi tải {url}: {e}")
          '
          
          echo "Kiểm tra danh sách file đã tải:"
          ls -la tweak_*.deb

      - name: Install cyan tool
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject tweaks into IPA (Standard Cyan Packing)
        run: |
          tweaks=""
          for f in tweak_*.deb; do
            if [ -f "$f" ]; then
              tweaks="$tweaks -f $f"
            fi
          done
          
          echo "Tham số tweak truyền vào: $tweaks"
          
          CMD="cyan -i youtube.ipa -o Output_App.ipa -uwe $tweaks"
          
          if [ -n "${{ inputs.display_name }}" ]; then
            CMD="$CMD -n '${{ inputs.display_name }}'"
          fi
          
          if [ -n "${{ inputs.bundle_id }}" ]; then
            CMD="$CMD -b ${{ inputs.bundle_id }}"
          fi
          
          echo "Thực thi: $CMD"
          eval $CMD

      - name: Upload Patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-Da-Inject
          path: Output_App.ipa
