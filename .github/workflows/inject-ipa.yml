name: Auto Inject IPA and Tweak Pro

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct tới file IPA gốc (Decrypted)'
        required: true
        type: string
      deb_url:
        description: 'URL direct tới file Tweak (.deb)'
        required: true
        type: string
      display_name:
        description: 'Tên App mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string
      bundle_id:
        description: 'Bundle ID mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download IPA and Tweak
        run: |
          echo "Đang tải file IPA..."
          wget "${{ inputs.ipa_url }}" --no-verbose -O youtube.ipa
          
          echo "Đang tải file Tweak (.deb)..."
          wget "${{ inputs.deb_url }}" --no-verbose -O custom_tweak.deb

      - name: Install cyan tool
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject tweaks into IPA (Standard Cyan Packing)
        run: |
          # Thu gom tất cả file deb có trong thư mục theo đúng cách các repo mẫu làm
          tweaks=""
          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          
          echo "Danh sách tweak được tìm thấy: $tweaks"
          
          # Xây dựng lệnh cyan linh hoạt
          CMD="cyan -i youtube.ipa -o Output_App.ipa -uwef $tweaks"
          
          if [ -n "${{ inputs.display_name }}" ]; then
            CMD="$CMD -n '${{ inputs.display_name }}'"
          fi
          
          if [ -n "${{ inputs.bundle_id }}" ]; then
            CMD="$CMD -b ${{ inputs.bundle_id }}"
          fi
          
          echo "Thực thi: $CMD"
          eval $CMD

      - name: Upload Patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-Da-Inject
          path: Output_App.ipa
