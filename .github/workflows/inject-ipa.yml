name: Auto Inject IPA and Tweak Pro

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct tới file IPA gốc (Decrypted)'
        required: true
        type: string
      deb_urls:
        description: 'Danh sách URL các file Tweak (.deb), mỗi link một dòng'
        required: true
        type: string
      display_name:
        description: 'Tên App mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string
      bundle_id:
        description: 'Bundle ID mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download IPA and Tweaks
        run: |
          echo "Đang tải file IPA..."
          curl -L "${{ inputs.ipa_url }}" -o youtube.ipa
          
          echo "Đang tải các file Tweak (.deb)..."
          counter=1
          echo "${{ inputs.deb_urls }}" | while read -r url; do
            [ -z "$url" ] && continue
            url=$(echo "$url" | tr -d '\r')
            echo "Đang tải tweak $counter từ: $url"
            curl -L "$url" -o "tweak_$counter.deb"
            counter=$((counter + 1))
          done
          
          echo "Kiểm tra lại toàn bộ file trong thư mục:"
          ls -la

      - name: Install cyan tool
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject tweaks into IPA (Standard Cyan Packing)
        run: |
          # Thu gom tất cả file có tên tweak_*.deb
          tweaks=""
          for f in tweak_*.deb; do
            if [ -f "$f" ]; then
              tweaks="$tweaks -f $f"
            fi
          done
          
          echo "Tham số tweak truyền vào: $tweaks"
          
          CMD="cyan -i youtube.ipa -o Output_App.ipa -uwe $tweaks"
          
          if [ -n "${{ inputs.display_name }}" ]; then
            CMD="$CMD -n '${{ inputs.display_name }}'"
          fi
          
          if [ -n "${{ inputs.bundle_id }}" ]; then
            CMD="$CMD -b ${{ inputs.bundle_id }}"
          fi
          
          echo "Thực thi: $CMD"
          eval $CMD

      - name: Upload Patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-Da-Inject
          path: Output_App.ipa
