name: Auto Inject IPA and Tweak Pro

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct tới file IPA'
        required: true
        type: string

      deb_url_1:
        description: 'Tweak 1 (.deb)'
        required: false
        default: ''
        type: string

      deb_url_2:
        description: 'Tweak 2 (.deb)'
        required: false
        default: ''
        type: string

      deb_url_3:
        description: 'Tweak 3 (.deb)'
        required: false
        default: ''
        type: string

      deb_url_4:
        description: 'Tweak 4 (.deb)'
        required: false
        default: ''
        type: string

      deb_url_5:
        description: 'Tweak 5 (.deb)'
        required: false
        default: ''
        type: string

      display_name:
        description: 'Tên App mới'
        required: false
        default: ''
        type: string

      bundle_id:
        description: 'Bundle ID mới'
        required: false
        default: ''
        type: string


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    runs-on: macos-latest

    steps:

    - uses: actions/checkout@v4


    - name: Download IPA and Tweaks
      shell: bash
      env:
        IPA_URL: ${{ inputs.ipa_url }}
        DEB1: ${{ inputs.deb_url_1 }}
        DEB2: ${{ inputs.deb_url_2 }}
        DEB3: ${{ inputs.deb_url_3 }}
        DEB4: ${{ inputs.deb_url_4 }}
        DEB5: ${{ inputs.deb_url_5 }}

      run: |

        set -e

        wget "$IPA_URL" -O youtube.ipa


        count=1

        for url in "$DEB1" "$DEB2" "$DEB3" "$DEB4" "$DEB5"
        do
          if [ -n "$url" ]; then
            wget "$url" -O "tweak_$count.deb"
            count=$((count+1))
          fi
        done


        ls -lh *.deb || true



    - name: Install tools
      run: |

        pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

        brew install dpkg



    - name: Extract dependency libraries
      run: |

        mkdir -p extra_libs


        for deb in tweak_*.deb
        do

          if [ -f "$deb" ]; then

            mkdir temp

            dpkg-deb -x "$deb" temp


            find temp -name "*.dylib" -exec cp {} extra_libs/ \;


            rm -rf temp

          fi

        done


        echo "Libraries found:"
        ls -lh extra_libs || true



    - name: Inject Tweaks
      shell: bash
      env:
        DISPLAY_NAME: ${{ inputs.display_name }}
        BUNDLE_ID: ${{ inputs.bundle_id }}

      run: |

        args=(-i youtube.ipa -o Output_App.ipa -uwef)


        for f in tweak_*.deb
        do
          [ -f "$f" ] && args+=("$f")
        done


        if [ -n "$DISPLAY_NAME" ]; then
          args+=(-n "$DISPLAY_NAME")
        fi


        if [ -n "$BUNDLE_ID" ]; then
          args+=(-b "$BUNDLE_ID")
        fi


        cyan "${args[@]}"



    - name: Patch dylib dependencies
      run: |

        mkdir payload

        unzip -q Output_App.ipa -d payload


        APP=$(find payload -name "*.app" | head -1)


        mkdir -p "$APP/Frameworks"


        cp extra_libs/*.dylib "$APP/Frameworks/" 2>/dev/null || true


        for dylib in "$APP"/Frameworks/*.dylib
        do

          if [ -f "$dylib" ]; then

            install_name_tool \
            -add_rpath "@loader_path/Frameworks" \
            "$dylib" 2>/dev/null || true

          fi

        done


        cd payload

        zip -qr ../Fixed_App.ipa .



    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: App-Fixed
        path: Fixed_App.ipa
