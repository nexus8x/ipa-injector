name: Auto Inject IPA and Tweak Pro

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct tới file IPA gốc (Decrypted)'
        required: true
        type: string

      deb_urls:
        description: 'Một hoặc nhiều URL tweak (.deb), mỗi link một dòng'
        required: true
        type: string

      display_name:
        description: 'Tên App mới (Để trống sẽ tự lấy từ IPA)'
        default: ''
        required: false
        type: string

      bundle_id:
        description: 'Bundle ID mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # Cực kỳ quan trọng để GitHub Actions có quyền tạo Release và Tag

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download IPA and Tweaks
        shell: bash
        env:
          DEB_URLS: ${{ inputs.deb_urls }}
        run: |
          set -e

          echo "Downloading IPA..."
          wget --tries=3 --timeout=30 "${{ inputs.ipa_url }}" -O app.ipa
          test -s app.ipa

          tweak_count=0

          echo "$DEB_URLS" | while IFS= read -r url; do
            [ -z "$url" ] && continue

            FILE=$(basename "${url%%\?*}")

            if [[ "$FILE" != *.deb ]]; then
              FILE="${FILE}.deb"
            fi

            echo "Downloading $FILE"

            wget --tries=3 --timeout=30 "$url" -O "$FILE"

            test -s "$FILE"

            tweak_count=$((tweak_count+1))
          done

          ls -lh *.deb

      - name: Install cyan tool
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Prepare Output Name
        shell: bash
        run: |
          APP_NAME="${{ inputs.display_name }}"

          if [ -z "$APP_NAME" ]; then
            # Thử giải nén và tìm tên trong Info.plist
            unzip -qq app.ipa -d ipa
            INFO=$(find ipa/Payload -name Info.plist | head -n1)
            
            if [ -n "$INFO" ]; then
              APP_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$INFO" 2>/dev/null || true)
              if [ -z "$APP_NAME" ]; then
                APP_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleName" "$INFO" 2>/dev/null || true)
              fi
            fi
            
            rm -rf ipa
          fi

          # Nếu vẫn không tìm thấy, lấy luôn tên từ file IPA gốc (bỏ đuôi .ipa)
          if [ -z "$APP_NAME" ]; then
            ORIGINAL_IPA_BASENAME=$(basename "${{ inputs.ipa_url }}" \?*)
            APP_NAME="${ORIGINAL_IPA_BASENAME%.ipa}"
          fi

          [ -z "$APP_NAME" ] && APP_NAME="CustomApp"

          first=""
          count=0

          for f in *.deb; do
            [ -f "$f" ] || continue
            count=$((count+1))
            if [ -z "$first" ]; then
              first=$(basename "$f" .deb)
            fi
          done

          if [ "$count" -gt 1 ]; then
            TWEAK_NAME="${first} +$((count-1))"
          else
            TWEAK_NAME="$first"
          fi

          SAFE_APP=$(echo "$APP_NAME" | tr '/\:*?"<>|' '_')
          SAFE_TWEAK=$(echo "$TWEAK_NAME" | tr '/\:*?"<>|' '_')

          OUTPUT="${SAFE_APP} (${SAFE_TWEAK}).ipa"

          echo "OUTPUT_FILE=$OUTPUT" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${SAFE_APP} (${SAFE_TWEAK})" >> $GITHUB_ENV

      - name: Inject tweaks
        shell: bash
        run: |
          tweaks=()
          for f in *.deb; do
            [ -f "$f" ] || continue
            tweaks+=("-u" "$f")
          done

          if [ ${#tweaks[@]} -eq 0 ]; then
            echo "Error: Không tìm thấy file .deb nào!"
            exit 1
          fi

          CMD=(cyan -i app.ipa -o "${{ env.OUTPUT_FILE }}" "${tweaks[@]}" -ef)

          if [ -n "${{ inputs.display_name }}" ]; then
            CMD+=("-n" "${{ inputs.display_name }}")
          fi

          if [ -n "${{ inputs.bundle_id }}" ]; then
            CMD+=("-b" "${{ inputs.bundle_id }}")
          fi

          echo "Running command:"
          printf "%s\n" "${CMD[*]}"

          "${CMD[@]}"

      - name: Upload IPA (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_FILE }}

      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT_FILE }}
          tag_name: v${{ github.run_number }}
          name: Release ${{ env.ARTIFACT_NAME }} (v${{ github.run_number }})
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
