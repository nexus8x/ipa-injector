name: Auto Inject IPA and Tweak Pro

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct tới file IPA gốc (Decrypted)'
        required: true
        type: string

      deb_urls:
        description: 'Một hoặc nhiều URL tweak (.deb), mỗi link một dòng'
        required: true
        type: string

      display_name:
        description: 'Tên App mới (Để trống sẽ tự lấy từ IPA)'
        default: ''
        required: false
        type: string

      bundle_id:
        description: 'Bundle ID mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download IPA and Tweaks
        shell: bash
        env:
          DEB_URLS: ${{ inputs.deb_urls }}
        run: |
          set -e

          echo "Downloading IPA..."
          wget --tries=3 --timeout=30 "${{ inputs.ipa_url }}" -O app.ipa
          test -s app.ipa

          tweak_count=0

          echo "$DEB_URLS" | while IFS= read -r url; do
            [ -z "$url" ] && continue

            FILE=$(basename "${url%%\?*}")

            if [[ "$FILE" != *.deb ]]; then
              FILE="${FILE}.deb"
            fi

            echo "Downloading $FILE"

            wget --tries=3 --timeout=30 "$url" -O "$FILE"

            test -s "$FILE"

            tweak_count=$((tweak_count+1))
          done

          ls -lh *.deb

      - name: Install cyan tool
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Prepare Output Name
        shell: bash
        run: |
          APP_NAME="${{ inputs.display_name }}"

          if [ -z "$APP_NAME" ]; then

            unzip -qq app.ipa -d ipa

            INFO=$(find ipa/Payload -name Info.plist | head -n1)

            APP_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$INFO" 2>/dev/null || true)

            if [ -z "$APP_NAME" ]; then
              APP_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleName" "$INFO" 2>/dev/null || true)
            fi

            rm -rf ipa

          fi

          [ -z "$APP_NAME" ] && APP_NAME="Patched App"

          first=""
          count=0

          for f in *.deb; do
            [ -f "$f" ] || continue

            count=$((count+1))

            if [ -z "$first" ]; then
              first=$(basename "$f" .deb)
            fi
          done

          if [ "$count" -gt 1 ]; then
            TWEAK_NAME="${first} +$((count-1))"
          else
            TWEAK_NAME="$first"
          fi

          SAFE_APP=$(echo "$APP_NAME" | tr '/\:*?"<>|' '_')
          SAFE_TWEAK=$(echo "$TWEAK_NAME" | tr '/\:*?"<>|' '_')

          OUTPUT="${SAFE_APP} (${SAFE_TWEAK}).ipa"

          echo "OUTPUT_FILE=$OUTPUT" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${SAFE_APP} (${SAFE_TWEAK})" >> $GITHUB_ENV

      - name: Inject tweaks
        shell: bash
        run: |
          tweaks=""

          for f in *.deb; do
            [ -f "$f" ] || continue
            tweaks="$tweaks \"$f\""
          done

          CMD="cyan -i app.ipa -o \"${{ env.OUTPUT_FILE }}\" -uwef $tweaks"

          if [ -n "${{ inputs.display_name }}" ]; then
            CMD="$CMD -n \"${{ inputs.display_name }}\""
          fi

          if [ -n "${{ inputs.bundle_id }}" ]; then
            CMD="$CMD -b \"${{ inputs.bundle_id }}\""
          fi

          echo "$CMD"

          eval "$CMD"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_FILE }}
