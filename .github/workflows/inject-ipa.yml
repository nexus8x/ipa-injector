name: Auto Inject IPA and Multiple Tweaks

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct IPA'
        required: true
        type: string
      deb_urls:
        description: 'URL direct Debs (Mỗi URL một dòng hoặc cách nhau bằng dấu cách)'
        required: true
        type: string
      display_name:
        description: 'Tên App mới (ĐỂ TRỐNG NẾU GIỮ NGUYÊN)'
        required: false
        default: ''
        type: string
      bundle_id:
        description: 'Bundle ID mới (ĐỂ TRỐNG NẾU GIỮ NGUYÊN)'
        required: false
        default: ''
        type: string

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Files
        run: |
          curl -L "${{ inputs.ipa_url }}" -o input.ipa
          
          COUNTER=1
          CMD_ARGS="-i input.ipa -o Output_App.ipa"
          
          # Đọc các URL deb an toàn không bị lỗi ký tự đặc biệt
          for url in ${{ inputs.deb_urls }}; do
            clean_url=$(echo "$url" | xargs)
            [ -z "$clean_url" ] && continue
            curl -L "$clean_url" -o "tweak_$COUNTER.deb"
            CMD_ARGS="$CMD_ARGS -f tweak_$COUNTER.deb"
            COUNTER=$((COUNTER + 1))
          done
          
          if [ -n "${{ inputs.display_name }}" ]; then
            CMD_ARGS="$CMD_ARGS -n '${{ inputs.display_name }}'"
          fi
          
          if [ -n "${{ inputs.bundle_id }}" ]; then
            CMD_ARGS="$CMD_ARGS -b ${{ inputs.bundle_id }}"
          fi
          
          echo "CYAN_CMD=cyan $CMD_ARGS" >> $GITHUB_ENV

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject and Process
        run: |
          eval $CYAN_CMD
          
          APP_NAME="${{ inputs.display_name }}"
          if [ -z "$APP_NAME" ]; then
            APP_NAME="InjectedApp"
          fi
          
          SAFE_NAME=$(echo "$APP_NAME" | tr -cd '[:alnum:]_-_ ')
          SAFE_NAME=$(echo "$SAFE_NAME" | tr ' ' '_')
          
          VERSION="1.0.0"
          
          mv Output_App.ipa "${SAFE_NAME}_v${VERSION}.ipa"
          echo "FINAL_FILE=${SAFE_NAME}_v${VERSION}.ipa" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_VER=$VERSION" >> $GITHUB_ENV

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.APP_VER }}-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" || true
          git push origin "$TAG" || true
          
          gh release create "$TAG" "${{ env.FINAL_FILE }}" --title "${{ env.APP_NAME }} v${{ env.APP_VER }}" --notes "App Name: ${{ env.APP_NAME }} | Version: ${{ env.APP_VER }} | Injected via GitHub Actions"
