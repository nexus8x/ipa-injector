name: Release IPA Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Create Release
    runs-on: macos-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build IPA Package
        run: |
          echo "Đang build IPA..."
          # Đặt lệnh build của bạn ở đây để tạo ra file .ipa trong thư mục build/
          mkdir -p build
          # (Ví dụ file IPA thực tế của bạn tên gì khi build xong, nó sẽ tự quét)
          # touch "build/TenAppCuaBan_${{ github.ref_name }}.ipa"

      - name: Extract IPA details
        id: info
        run: |
          # Tự động quét và lấy chính xác tên file .ipa được sinh ra
          IPA_FILE=$(basename build/*.ipa)
          echo "ipa_name=$IPA_FILE" >> $GITHUB_OUTPUT
          echo "Found IPA: $IPA_FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.ipa
          name: "Release ${{ github.ref_name }}"
          body: |
            ## App Release Info
            
            * **IPA File Name:** `${{ steps.info.outputs.ipa_name }}`
            * **Version/Tag:** `${{ github.ref_name }}`
            * **Platform:** `iOS`
            
            ---
            
            ## Must read:
            * File IPA được tự động build từ phiên bản tag **${{ github.ref_name }}**.
            * Hãy ký (sign) file `${{ steps.info.outputs.ipa_name }}` trước khi cài lên thiết bị.
          draft: false
          prerelease: false
