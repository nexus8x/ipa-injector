name: Auto Inject IPA and Tweak

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL to the decrypted IPA file'
        required: true
        type: string
      deb_url:
        description: 'URL to the Tweak (.deb) file'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Files
        run: |
          echo "Đang tải file IPA..."
          curl -L -o input.ipa "${{ github.event.inputs.ipa_url }}"
          
          echo "Đang tải file Tweak (.deb)..."
          curl -L -o tweak.deb "${{ github.event.inputs.deb_url }}"

      - name: Inject Tweak
        run: |
          echo "Giải nén IPA..."
          unzip -q input.ipa -d payload_dir
          
          echo "Giải nén file Tweak .deb..."
          mkdir -p deb_extracted
          # Dùng lệnh tar/ar tích hợp sẵn hoặc giải nén trực tiếp bằng tar
          tar -xf tweak.deb -C deb_extracted || tar -xf tweak.deb || ar x tweak.deb
          
          # Tìm file data.tar bên trong deb nếu có
          if [ -f "data.tar.lzma" ]; then tar -xf data.tar.lzma -C deb_extracted; fi
          if [ -f "data.tar.gz" ]; then tar -xf data.tar.gz -C deb_extracted; fi
          if [ -f "data.tar.xz" ]; then tar -xf data.tar.xz -C deb_extracted; fi
          
          APP_DIR=$(ls payload_dir/Payload)
          mkdir -p "payload_dir/Payload/$APP_DIR"
          
          echo "Chèn file dylib/tweak vào ứng dụng..."
          find deb_extracted -name "*.dylib" -exec cp {} "payload_dir/Payload/$APP_DIR/" \;
          find deb_extracted -name "*.bundle" -exec cp -r {} "payload_dir/Payload/$APP_DIR/" \;
          
          echo "Đóng gói lại file IPA..."
          cd payload_dir
          zip -9qr ../Output_App.ipa .
          cd ..

      - name: Upload Patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: Final-Patched-IPA
          path: Output_App.ipa
