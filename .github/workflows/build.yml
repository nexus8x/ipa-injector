name: Auto Inject IPA and Multiple Tweaks

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct tới file IPA gốc (Decrypted)'
        required: true
        type: string
      deb_urls:
        description: 'Danh sách URL direct tới các file .deb (Cách nhau bằng khoảng trắng)'
        required: true
        type: string
      display_name:
        description: 'Tên App mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string
      bundle_id:
        description: 'Bundle ID mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download IPA and Multiple Tweaks
        run: |
          echo "Đang tải file IPA..."
          curl -L "${{ inputs.ipa_url }}" -o input.ipa
          
          echo "Đang tải danh sách file Tweak..."
          COUNTER=1
          CMD_ARGS="-i input.ipa -o Output_App.ipa"
          
          # Sử dụng xargs hoặc đọc chuỗi an toàn để tránh lỗi cú pháp khoảng trắng
          for url in ${{ inputs.deb_urls }}; do
            # Bỏ qua nếu dòng trống
            [ -z "$url" ] && continue
            
            echo "Đang tải tweak thứ $COUNTER từ: $url"
            curl -L "$url" -o "tweak_$COUNTER.deb"
            CMD_ARGS="$CMD_ARGS -f tweak_$COUNTER.deb"
            COUNTER=$((COUNTER + 1))
          done
          
          echo "CYAN_CMD=cyan $CMD_ARGS" >> $GITHUB_ENV

      - name: Install cyan tool
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject Tweaks and Customize App
        run: |
          FINAL_CMD="$CYAN_CMD"
          
          if [ -n "${{ inputs.display_name }}" ]; then
            FINAL_CMD="$FINAL_CMD -n '${{ inputs.display_name }}'"
          fi
          
          if [ -n "${{ inputs.bundle_id }}" ]; then
            FINAL_CMD="$FINAL_CMD -b ${{ inputs.bundle_id }}"
          fi
          
          echo "Thực thi: $FINAL_CMD"
          eval $FINAL_CMD

      - name: Generate Auto Tag & Release
        id: auto_tag
        run: |
          AUTO_TAG="v$(date +'%Y.%m.%d-%H%M')"
          echo "tag=$AUTO_TAG" >> $GITHUB_OUTPUT
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$AUTO_TAG"
          git push origin "$AUTO_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output_App.ipa
          tag_name: ${{ steps.auto_tag.outputs.tag }}
          name: "${{ inputs.display_name != '' && inputs.display_name || 'Custom App' }} ${{ steps.auto_tag.outputs.tag }}"
          body: |
            ## App Release Info
            
            * **App Name:** `${{ inputs.display_name != '' && inputs.display_name || 'Giữ nguyên' }}`
            * **Bundle ID:** `${{ inputs.bundle_id != '' && inputs.bundle_id || 'Giữ nguyên' }}`
            * **Version:** `${{ steps.auto_tag.outputs.tag }}`
            * **Platform:** `iOS`
            
            ---
            
            ## Must read:
            * File IPA được build tự động và gán mác thời gian.
            * Hãy ký (sign) file `Output_App.ipa` trước khi cài đặt.
          draft: false
          prerelease: false
