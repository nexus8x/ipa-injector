name: Auto Inject IPA and Tweak

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL to the decrypted IPA file'
        required: true
        type: string
      deb_url:
        description: 'URL to the Tweak (.deb) file'
        required: true
        type: string

jobs:
  build:
- runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Files
        run: |
          echo "Đang tải file IPA..."
          curl -L -o input.ipa "${{ github.event.inputs.ipa_url }}"
          
          echo "Đang tải file Tweak (.deb)..."
          curl -L -o tweak.deb "${{ github.event.inputs.deb_url }}"

      - name: Inject Tweak (Manual Method)
        run: |
          echo "Giải nén IPA và Tweak..."
          unzip -q input.ipa -d payload_dir
          dpkg-deb -R tweak.deb deb_dir
          
          # Tìm thư mục .app bên trong Payload
          APP_DIR=$(ls payload_dir/Payload)
          
          echo "Đang chèn tweak vào ứng dụng..."
          mkdir -p "payload_dir/Payload/$APP_DIR/Frameworks"
          
          # Copy các file framework/dylib từ tweak vào app
          if [ -d "deb_dir/Library/MobileSubstrate/DynamicLibraries" ]; then
            cp -r deb_dir/Library/MobileSubstrate/DynamicLibraries/* "payload_dir/Payload/$APP_DIR/"
          elif [ -d "deb_dir/usr/lib" ]; then
            cp -r deb_dir/usr/lib/* "payload_dir/Payload/$APP_DIR/"
          fi
          
          echo "Đóng gói lại thành file IPA hoàn chỉnh..."
          cd payload_dir
          zip -9qr ../Output_App.ipa .
          cd ..

      - name: Upload Patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: Final-Patched-IPA
          path: Output_App.ipa
