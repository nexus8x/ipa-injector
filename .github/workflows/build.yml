name: Auto Inject IPA and Tweak

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL to the decrypted IPA file'
        required: true
        type: string
      deb_url:
        description: 'URL to the Tweak (.deb) file'
        required: true
        type: string
      bundle_id:
        description: 'Bundle ID mới (Để trống nếu giữ nguyên)'
        required: false
        type: string
      app_name:
        description: 'Tên App mới (Để trống nếu giữ nguyên)'
        required: false
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew update
          brew install ldid

      - name: Download Azule and Files
        run: |
          echo "Đang tải công cụ Azule..."
          curl -sL https://raw.githubusercontent.com/Al4EP/Azule/main/azule -o azule
          chmod +x azule
          
          echo "Đang tải file IPA..."
          curl -L -o input.ipa "${{ github.event.inputs.ipa_url }}"
          
          echo "Đang tải file Tweak (.deb)..."
          mkdir -p tweaks
          curl -L -o tweaks/tweak.deb "${{ github.event.inputs.deb_url }}"

      - name: Run Azule Injection
        run: |
          # Dùng Azule chính chủ để inject, tự động vá binary và chèn cấu hình chuẩn
          ./azule -i input.ipa -o Output_App.ipa -f tweaks/ -v

      - name: Customize Bundle ID and App Name
        run: |
          if [ -n "${{ github.event.inputs.bundle_id }}" ] || [ -n "${{ github.event.inputs.app_name }}" ]; then
            echo "Đang tùy chỉnh thông tin App..."
            unzip -q Output_App.ipa -d custom_dir
            APP_DIR=$(ls custom_dir/Payload)
            APP_PATH="custom_dir/Payload/$APP_DIR"
            
            if [ -n "${{ github.event.inputs.bundle_id }}" ]; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${{ github.event.inputs.bundle_id }}" "$APP_PATH/Info.plist"
            fi
            
            if [ -n "${{ github.event.inputs.app_name }}" ]; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${{ github.event.inputs.app_name }}" "$APP_PATH/Info.plist" || true
              /usr/libexec/PlistBuddy -c "Set :CFBundleName ${{ github.event.inputs.app_name }}" "$APP_PATH/Info.plist" || true
            fi
            
            cd custom_dir
            zip -9qr ../Output_App.ipa .
            cd ..
          fi

      - name: Upload Patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-Da-Inject
          path: Output_App.ipa
