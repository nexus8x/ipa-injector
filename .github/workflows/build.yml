name: Auto Inject IPA and Tweak

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL to the decrypted IPA file'
        required: true
        type: string
      deb_url:
        description: 'URL to the Tweak (.deb) file'
        required: true
        type: string
      bundle_id:
        description: 'Bundle ID mới (Để trống nếu giữ nguyên)'
        required: false
        type: string
      app_name:
        description: 'Tên App mới (Để trống nếu giữ nguyên)'
        required: false
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Files
        run: |
          echo "Đang tải file IPA..."
          curl -L -o input.ipa "${{ github.event.inputs.ipa_url }}"
          
          echo "Đang tải file Tweak (.deb)..."
          curl -L -o tweak.deb "${{ github.event.inputs.deb_url }}"

      - name: Inject Tweak and Customize
        run: |
          echo "Giải nén IPA..."
          unzip -q input.ipa -d payload_dir
          
          echo "Giải nén file Tweak .deb..."
          mkdir -p deb_extracted
          cd deb_extracted
          ar x ../tweak.deb || tar -xf ../tweak.deb
          
          for tar_file in data.tar.*; do
            if [ -f "$tar_file" ]; then
              tar -xf "$tar_file"
            fi
          done
          cd ..
          
          APP_DIR=$(ls payload_dir/Payload)
          APP_PATH="payload_dir/Payload/$APP_DIR"
          
          echo "=== BẮT ĐẦU CHÈN TWEAK ==="
          # Tìm và copy mọi file dylib
          find deb_extracted -name "*.dylib" | while read -r dylib; do
            echo "Tìm thấy dylib: $dylib -> Đang chèn vào App..."
            cp -v "$dylib" "$APP_PATH/"
          done
          
          # Tìm và copy mọi thư mục bundle
          find deb_extracted -name "*.bundle" -type d | while read -r bundle; do
            echo "Tìm thấy bundle: $bundle -> Đang chèn vào App..."
            cp -rv "$bundle" "$APP_PATH/"
          done
          echo "=== HOÀN TẤT CHÈN TWEAK ==="
          
          # Đổi Bundle ID nếu người dùng nhập
          NEW_BUNDLE_ID="${{ github.event.inputs.bundle_id }}"
          if [ -n "$NEW_BUNDLE_ID" ]; then
            echo "Đang đổi Bundle ID thành: $NEW_BUNDLE_ID"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $NEW_BUNDLE_ID" "$APP_PATH/Info.plist"
          fi
          
          # Đổi Tên App nếu người dùng nhập
          NEW_APP_NAME="${{ github.event.inputs.app_name }}"
          if [ -n "$NEW_APP_NAME" ]; then
            echo "Đang đổi Tên App thành: $NEW_APP_NAME"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $NEW_APP_NAME" "$APP_PATH/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleName $NEW_APP_NAME" "$APP_PATH/Info.plist" || true
          fi
          
          echo "Đóng gói lại file IPA..."
          cd payload_dir
          zip -9qr ../Output_App.ipa .
          cd ..

      - name: Upload Patched IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-Da-Inject
          path: Output_App.ipa
