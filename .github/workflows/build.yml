name: Auto Inject IPA and Tweak Custom

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'URL direct tới file IPA gốc (Decrypted)'
        required: true
        type: string
      deb_url:
        description: 'URL direct tới file Tweak (.deb)'
        required: true
        type: string
      display_name:
        description: 'Tên App mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string
      bundle_id:
        description: 'Bundle ID mới (Để trống nếu giữ nguyên)'
        default: ''
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download IPA and Tweak
        run: |
          echo "Đang tải file IPA từ link direct..."
          wget "${{ inputs.ipa_url }}" --no-verbose -O input.ipa
          
          echo "Đang tải file Tweak (.deb) từ link direct..."
          wget "${{ inputs.deb_url }}" --no-verbose -O tweak.deb

      - name: Install cyan tool
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject Tweak and Customize App
        run: |
          # Xây dựng câu lệnh cyan với các tùy chọn tương ứng
          CMD="cyan -i input.ipa -o Output_App.ipa -f tweak.deb"
          
          if [ -n "${{ inputs.display_name }}" ]; then
            CMD="$CMD -n '${{ inputs.display_name }}'"
          fi
          
          if [ -n "${{ inputs.bundle_id }}" ]; then
            CMD="$CMD -b ${{ inputs.bundle_id }}"
          fi
          
          echo "Thực thi lệnh: $CMD"
          eval $CMD

      - name: Upload Patched IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Da-Inject
          path: Output_App.ipa
